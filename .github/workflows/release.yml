name: Release Debian package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ github.event.release.id }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate published Release and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py validate
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-yaml
      - name: Run unit tests
        run: PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests" /usr/bin/python3 -m unittest discover -s tests -v
      - name: Build Debian package
        run: python3 scripts/build_deb.py --tag "$RELEASE_TAG"
      - name: Test native installation and upgrades
        run: bash scripts/test_deb_install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist
      - name: Upload assets to the same Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py upload
